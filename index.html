<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rock_Paper_Scissors</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="heading">Rock - Paper - Scissors</div>
    <div class="choices">
      <img src="./images/rock.png" id="rock" class="choice" />

      <img src="./images/paper.png" id="paper" class="choice" />

      <img src="./images/scissors.png" id="scissors" class="choice" />
    </div>

    <div class="scores">
      <div id="user">
        <div id="userscore">0</div>
        <div id="userscore-para">You</div>
      </div>
      <div id="comp">
        <div id="compscore">0</div>
        <div id="compscore-para">Comp</div>
      </div>
    </div>

    <div id="reset">
      <button id="resetbtn">Reset Score</button>
    </div>

    <div class="comp_choice">
      <div id="comp_decision">Computer chooses</div>
    </div>

    <div class="msg-container">
      <div class="msg">Make a Choice</div>
    </div>

    <footer class="footer">
      <p>© 2026 Rock Paper Scissors Game | Ajit Mangsulikar</p>
    </footer>
  </body>
  <script src="script.js"></script>
</html>
